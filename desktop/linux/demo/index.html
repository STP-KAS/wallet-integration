<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux · Wallet integration</title>
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body data-platform="linux">
  <main>
    <p><a href="/">← all platforms</a></p>
    <h1><span data-platform-label>Linux</span></h1>
    <p class="sub">Chromium, Google Chrome, Brave, or Edge. Firefox is not a Kasware/Kastle host. Firefox users pay with a kaspa: URI or Kaspa NG.</p>
    <div class="card">
      <p><span class="pill">inject</span> Kasware · Kastle</p>
      <p>Detected: <strong data-detected>checking…</strong></p>
      <p>Session: <code data-wallet-addr>not connected</code></p>
      <p class="row">
        <button type="button" data-wallet-id="kasware">Kasware</button>
        <button type="button" data-wallet-id="kastle">Kastle</button>
        <button type="button" class="ghost" data-wallet-logout hidden>Log out</button>
      </p>
      <p class="status" data-status></p>
      <div data-holdings></div>
    </div>
    <div class="card">
      <h2>Send (inject or kaspa: URI)</h2>
      <form data-pay-form>
        <p><label>To<br><input name="to" placeholder="kaspa:qz…" style="width:100%;padding:8px"></label></p>
        <p><label>Amount KAS<br><input name="kas" type="number" step="0.00000001" min="0" value="0.2" style="width:100%;padding:8px"></label></p>
        <button type="submit">Pay</button>
      </form>
      <p class="mono" data-pay-out></p>
    </div>
    <h2>Wallets on Linux</h2>
    <div class="grid" data-catalog></div>
  </main>
  <script src="/inject/kaspa-wallets.js"></script>
  <script src="/inject/pay.js"></script>
  <script src="/web/demo-app.js"></script>
</body>
</html>
